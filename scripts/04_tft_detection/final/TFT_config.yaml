# ============================================================
# TFT + LightGBM 舆情异常检测配置文件
# ============================================================

# 数据处理配置
data:
  # 时间相关
  time_column: "timestamp"
  freq: "15min"  # 数据频率：15分钟
    
  # 变换方法中不执行的（TFT自带标准化）
  skip_transforms:
    - "standardize"
  
  # 节假日配置
  holidays:
    country: "CN"  # 中国
    include_weekends: true  # 周末是否算作特殊日
    
# 可预知时变变量配置
known_variables:
  # 时间特征
  time_features:
    - "hour"
    - "dayofweek"
    - "month"
    - "is_weekend"
    - "is_holiday"
    - "time_slot"  # 时段：凌晨/早晨/上午/下午/傍晚/晚上/深夜
  
  # 运营事件编码方式
  event_encoding: "label"  # label / onehot

# ============================================================
# TFT模型配置
# ============================================================
tft_models:
global:
  time_column: "time_idx"
  group_ids: ["group_id"]
  static_categoricals: ["group_id"]
  
  # 强制分位数配置: P10, P50, P90
  quantiles: [0.1, 0.5, 0.9]

# 定义 n 个不同的模型配置
tft_models:

# ===== 评论+广场PCA模型 =====

  model_comment_pc1:
    seed: 42
    target: comment_pc1
    min_encoder_length: 36
    max_encoder_length: 108
    max_prediction_length: 1
    hidden_size: 20
    learning_rate: 0.004
    dropout: 0.15
  model_post_pc2:
    seed: 1024
    target: post_pc2
    min_encoder_length: 64
    max_encoder_length: 192
    max_prediction_length: 1
    hidden_size: 20
    learning_rate: 0.004
    dropout: 0.15


